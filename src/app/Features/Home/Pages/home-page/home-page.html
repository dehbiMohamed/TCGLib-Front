<section class="page page--spacious home-page">
  <div class="home-page__hero">
    <div class="home-page__hero-panel">
      <div class="home-page__hero-content">
        <h1 class="home-page__title">TCGLib</h1>

        <div class="home-page__actions">
          <a
            routerLink="/cards"
            class="button button--primary home-page__action"
          >
            Cartes
          </a>

          <a
            routerLink="/decks"
            class="button button--secondary home-page__action"
          >
            Decks
          </a>
        </div>
      </div>
    </div>
  </div>

  @if (featuredCards().length > 0) {
    <div class="home-page__marquee-shell">
      <div class="home-card-marquee">
        @for (copy of marqueeCopies; track copy) {
          <div class="home-card-marquee__group">
            @for (card of featuredCards(); track card.id) {
              <a
                [routerLink]="['/cards', card.id]"
                [queryParams]="{ fromHome: '1' }"
                [attr.aria-label]="'Ouvrir ' + card.name"
                [attr.title]="card.name"
                class="home-page__card-link"
              >
                <img
                  [src]="card.imageUrl"
                  [alt]="card.name"
                  class="home-page__card-image"
                  decoding="async"
                  loading="lazy"
                />
              </a>
            }
          </div>
        }
      </div>
    </div>
  }
</section>
