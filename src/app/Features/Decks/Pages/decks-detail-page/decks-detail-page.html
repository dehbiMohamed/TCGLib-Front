<section class="space-y-6">
  <a
    routerLink="/decks"
    class="inline-flex items-center gap-2 rounded-lg border border-zinc-700 px-3 py-2 text-sm text-zinc-300 transition hover:border-amber-400 hover:text-amber-400"
  >
    Retour a mes decks
  </a>

  @if (deck; as currentDeck) {
    <header class="space-y-2">
      <h1 class="text-2xl font-bold text-zinc-100 sm:text-3xl">{{ currentDeck.name }}</h1>
      <p class="text-zinc-300">Format: {{ currentDeck.format }}</p>
    </header>

    <section class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
      <h2 class="text-lg font-semibold text-zinc-100">Plan de jeu</h2>
      <p class="mt-2 text-zinc-300">{{ currentDeck.gamePlan }}</p>
    </section>

    <section class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
      <h2 class="text-lg font-semibold text-zinc-100">Cartes clefs</h2>
      <ul class="mt-3 space-y-2">
        @for (card of currentDeck.keyCards; track card) {
          <li class="text-zinc-300">- {{ card }}</li>
        }
      </ul>
    </section>
  } @else {
    <p class="rounded-lg border border-dashed border-zinc-700 p-4 text-sm text-zinc-400">
      Deck introuvable pour l'id: "{{ deckId }}".
    </p>
  }
</section>
