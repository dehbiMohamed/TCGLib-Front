<header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="text-xl font-bold tracking-wide text-amber-400">
      TCGLib
    </a>

    <div class="flex items-center gap-2 sm:gap-4">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-zinc-800 text-white"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-300 transition hover:bg-zinc-800 hover:text-white"
        >
          {{ item.label }}
        </a>
      }
    </div>
  </nav>
</header>
